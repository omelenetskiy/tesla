services:
  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.4
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/config.json"]
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:4269:4269"
    volumes:
      - ./config.local.json:/etc/fleet-telemetry/config.json:ro
      - ./certs:/etc/fleet-telemetry/certs:ro

  vehicle-command-proxy:
    image: tesla/vehicle-command:latest
    user: root
    restart: unless-stopped
    ports:
      - "4443:4443"
    environment:
      - TESLA_HTTP_PROXY_TLS_CERT=/tls/fullchain.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/tls/privkey.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=4443
      - TESLA_HTTP_PROXY_TIMEOUT=10s
      - TESLA_KEY_FILE=/key/fleet-key.pem
      - TESLA_VERBOSE=true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./certs:/tls:ro
      - ./keys/private.pem:/key/fleet-key.pem:ro

