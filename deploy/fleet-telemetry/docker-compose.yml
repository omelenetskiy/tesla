services:
  fleet-telemetry:
    # Pin a tag rather than `latest`: the server version is part of the vehicle config's
    # contract (`delivery_policy` needs >= 0.7.1), and an unpinned image silently changes it.
    # Current tags: https://hub.docker.com/r/tesla/fleet-telemetry/tags
    image: tesla/fleet-telemetry:v0.9.4
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/config.json"]
    network_mode: host
    user: root
    restart: unless-stopped
    volumes:
      - ./config.local.json:/etc/fleet-telemetry/config.json:ro
      - ./certs:/etc/fleet-telemetry/certs:ro
